<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG Mobile — Сопровождение</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        linear-gradient(rgba(2, 10, 24, 0.72), rgba(1, 7, 18, 0.94)),
        radial-gradient(circle at 70% 20%, #073b72 0%, #03172e 35%, #010812 75%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(0, 110, 255, 0.16), transparent 28%),
        radial-gradient(circle at 80% 50%, rgba(0, 140, 255, 0.10), transparent 32%);
    }

    header {
      height: 94px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      border-bottom: 1px solid rgba(71, 153, 255, 0.18);
      background: rgba(2, 13, 30, 0.82);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .logo {
      width: 92px;
      height: 58px;
      border: 3px solid white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 19px;
      letter-spacing: -1px;
      position: relative;
    }

    .logo::after {
      content: "MOBILE";
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 2px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
    }

    .login {
      color: #c8d8ee;
      font-size: 17px;
    }

    main {
      width: min(1130px, 92%);
      margin: 74px auto 60px;
      position: relative;
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 54px);
      margin-bottom: 12px;
      text-shadow: 0 0 25px rgba(0, 125, 255, 0.65);
    }

    .hero p {
      color: #91a9c6;
      font-size: 17px;
    }

    .search-box {
      display: flex;
      gap: 14px;
      padding: 12px;
      border: 2px solid #086fff;
      border-radius: 18px;
      background: rgba(3, 17, 39, 0.9);
      box-shadow:
        0 0 18px rgba(0, 103, 255, 0.45),
        inset 0 0 25px rgba(0, 71, 155, 0.15);
      margin-bottom: 28px;
    }

    .search-input {
      flex: 1;
      height: 62px;
      border: 1px solid rgba(83, 137, 201, 0.35);
      border-radius: 12px;
      outline: none;
      padding: 0 22px;
      color: white;
      font-size: 18px;
      background: rgba(4, 21, 45, 0.95);
    }

    .search-input::placeholder {
      color: #7086a1;
    }

    .search-input:focus {
      border-color: #1580ff;
      box-shadow: 0 0 15px rgba(0, 119, 255, 0.25);
    }

    .search-button {
      width: 150px;
      border: none;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #087cff, #0755d8);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(0, 119, 255, 0.6);
    }

    .table {
      border: 1px solid rgba(41, 106, 178, 0.4);
      border-radius: 17px;
      overflow: hidden;
      background: rgba(2, 13, 29, 0.88);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
    }

    .table-head,
    .player {
      display: grid;
      grid-template-columns: 1fr 220px;
      align-items: center;
    }

    .table-head {
      padding: 21px 34px;
      color: #9eb5d0;
      font-size: 16px;
      border-bottom: 1px solid rgba(51, 104, 158, 0.28);
    }

    .player {
      min-height: 105px;
      padding: 15px 34px;
      border-bottom: 1px solid rgba(51, 104, 158, 0.2);
      transition: 0.2s;
    }
